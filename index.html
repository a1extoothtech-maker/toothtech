/* ===== V17 · фирменный стиль ToothTech ===== */
:root{--tt-ink:#17171A;--tt-graph:#26262B;--tt-grey:#6B6C73;--tt-line:#E3E3E6;--tt-bg:#F3F3F4;--tt-acc:#7A1F35;--tt-acc2:#A3283F;--tt-gold:#B89B62;--accent:#7A1F35;--line:#E3E3E6;--muted:#6B6C73}

.tt-space{flex:1}
.tt-bar select{width:auto!important;max-width:150px;background:#26262B;color:#ECECEE;border:1px solid #3A3A40;border-radius:6px;font-size:12px;padding:6px 8px;min-height:32px}
.tt-bar .btn{display:inline-flex!important;align-items:center;gap:6px;background:#26262B;color:#ECECEE;border:1px solid #3A3A40;border-radius:8px;min-height:34px;padding:6px 10px;font-size:12px;flex:none!important}
.tt-bar .btn:hover{background:#303036}
.tt-bar .btn svg{width:16px;height:16px;flex:none}
.tt-bar .btn.main{background:var(--tt-acc);border-color:var(--tt-acc);color:#fff;font-weight:600}

.tt-bar .cloud-btn[data-kind=error]{background:#3A1219;border-color:#7A1F35;color:#FFD6DD}.tt-bar .cloud-btn[data-kind=error] .dot{background:#FF5A72}

header.top{display:none!important}

/* ===== V19 · быстрая запись · следующий шаг · вкладки · меню · скрыть суммы · тёмная тема ===== */
/* шапка: меню вместо лишних кнопок */
.tt-bar #role,.tt-bar #export,.tt-bar #importBtn{display:none!important}
.tt-icon-btn{width:36px;padding:6px!important;justify-content:center}
.tt-menu{position:fixed;z-index:120;top:calc(58px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:min(340px,calc(100vw - 24px));background:var(--tt-card,#fff);color:var(--tt-ink,#17171A);border:1px solid var(--tt-line,#E3E3E6);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.22);padding:14px;display:flex;flex-direction:column;gap:14px}
.tt-menu h4{margin:0 0 6px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--tt-grey,#6B6C73);font-weight:600}
.tt-seg{display:flex;gap:4px;background:var(--tt-bg,#F3F3F4);border-radius:10px;padding:3px}
.tt-seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-size:12.5px;color:var(--tt-grey,#6B6C73);font-weight:500}
.tt-seg button[aria-pressed=true]{background:var(--tt-card,#fff);color:var(--tt-ink,#17171A);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
.tt-menu .tt-mrow{display:flex;gap:8px;flex-wrap:wrap}
.tt-menu .tt-mrow .btn{flex:1;justify-content:center}
.tt-menu #export,.tt-menu #importBtn{display:inline-flex!important;align-items:center;gap:6px}
.tt-menu svg{width:16px;height:16px}
.tt-docview{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;background:#FBF6EA;border:1px solid #E4D7BC;border-radius:12px;padding:10px 14px;font-size:13px}
.tt-docview b{flex:1}
/* скрыть суммы */
body.tt-hide-money .tt-money{filter:blur(7px);-webkit-user-select:none;user-select:none;transition:filter .15s}
.tt-eye[aria-pressed=true]{color:var(--tt-gold,#B89B62)!important;border-color:#4A4232!important}
/* следующий шаг */
.tt-next{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.tt-next-btn{background:var(--tt-ink,#17171A)!important;color:#fff!important;border-color:var(--tt-ink,#17171A)!important;font-weight:700;font-size:14px;padding:11px 18px;border-radius:10px;min-height:46px}
.tt-next-btn.ready{background:var(--tt-ready,#17744D)!important;border-color:var(--tt-ready,#17744D)!important}
.tt-next-btn.pay{background:var(--tt-gold,#B89B62)!important;border-color:var(--tt-gold,#B89B62)!important;color:#17171A!important}
.tt-next-hint{font-size:12px;color:var(--tt-grey,#6B6C73)}
.tt-progress{height:6px;border-radius:6px;background:var(--tt-bg,#F3F3F4);overflow:hidden;margin:2px 0 6px}
.tt-progress i{display:block;height:100%;background:var(--tt-acc,#7A1F35);border-radius:6px}
.tt-progress.ready i{background:var(--tt-ready,#17744D)}
.tt-stage-all>summary{cursor:pointer;font-size:12px;color:var(--tt-grey,#6B6C73);padding:4px 0;list-style:none}
.tt-stage-all>summary::-webkit-details-marker{display:none}
.tt-stage-all>summary:before{content:'▸ '}.tt-stage-all[open]>summary:before{content:'▾ '}
/* вкладки в наряде */
.tt-tabs{display:flex;gap:4px;margin:4px 0 6px;background:var(--tt-bg,#F3F3F4);border-radius:11px;padding:4px;position:sticky;top:-20px;z-index:2}
.tt-tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 6px;font-size:13px;font-weight:600;color:var(--tt-grey,#6B6C73);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tt-tabs button[aria-selected=true]{background:var(--tt-card,#fff);color:var(--tt-ink,#17171A);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tt-tabs button i{font-style:normal;font-size:10.5px;background:var(--tt-acc,#7A1F35);color:#fff;border-radius:9px;padding:1px 6px}
#detail .tt-tabhide{display:none!important}
@media(max-width:720px){.tt-tabs{top:-14px}.tt-tabs button{font-size:12px;padding:8px 4px}}
/* список: быстрые действия и свайпы */
.tt-quick-act{border:1px solid var(--tt-ready,#17744D);background:transparent;color:var(--tt-ready,#17744D);border-radius:20px;padding:4px 12px;font-size:11.5px;font-weight:700;min-height:28px}
.tt-quick-act.pay{border-color:var(--tt-gold,#B89B62);color:#7A5F27}
.tt-quick-act:hover{background:var(--tt-ready-bg,#EAF6EF)}
#list .order{touch-action:pan-y}
#list .order[data-swipe=next]{box-shadow:inset 6px 0 0 var(--tt-ready,#17744D)}
#list .order[data-swipe=pause]{box-shadow:inset -6px 0 0 #8E8F96}
/* быстрая запись */
.tt-quick{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
.tt-q-row{display:flex;gap:8px}

 if(received>0&&!pending&&received>=amount)return {key:'paid',icon:'✓ $',label:'Оплачено',hint:'Техник подтвердил получение полной суммы'};
 if(o.doctorSent&&!o.paymentNoticeAcknowledged)return {key:'sent',icon:'↗ $',label:'Оплата отправлена',hint:'Врач отметил перевод. Технику нужно проверить поступление и внести полученную сумму.'};

// ===== V12: полная копия и восстановление =====
const BACKUP_FORMAT='toothtech-backup-v1';
function allAttachments(){return attachmentDb().then(d=>new Promise((resolve,reject)=>{const q=d.transaction('files','readonly').objectStore('files').getAll();q.onsuccess=()=>{d.close();resolve(q.result)};q.onerror=()=>{d.close();reject(q.error)}}))}
function putAttachmentRecord(rec){return attachmentDb().then(d=>new Promise((resolve,reject)=>{const tr=d.transaction('files','readwrite');tr.objectStore('files').put(rec);tr.oncomplete=()=>{d.close();resolve()};tr.onerror=()=>{d.close();reject(tr.error)}}))}
function blobToDataUrl(b){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(b)})}
async function dataUrlToBlob(u){return (await fetch(u)).blob()}
function downloadBlob(name,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return localDay()+'_'+p(d.getHours())+'-'+p(d.getMinutes())}

async function exportBackup(prefix='ToothTech_backup'){
 let files=[],skipped=0;
 try{for(const f of await allAttachments()){try{files.push({id:f.id,order:f.order,name:f.name,type:f.type,created:f.created,data:await blobToDataUrl(f.blob)})}catch(e){skipped++}}}
 catch(e){if(!confirm('Вложения прочитать не удалось ('+e.message+'). Сохранить копию без фото и голосовых?'))return false}
 db.lastBackupAt=new Date().toISOString();save();
 const pack={format:BACKUP_FORMAT,app:'ToothTech',version:'V12',exportedAt:db.lastBackupAt,db,attachments:files};
 downloadBlob(prefix+'_'+stamp()+'.json',new Blob([JSON.stringify(pack)],{type:'application/json'}));
 if(skipped)alert('Копия сохранена, но '+skipped+' файл(ов) прочитать не удалось.');
 return true;
}

// --- слияние ---
const evKey=e=>[timeKey(e.time),e.type,e.by,e.text].join('|');
const revKey=r=>[timeKey(r.time),r.field,r.old,r.value,r.by].join('|');
const stepKey=x=>[x.name,timeKey(x.time),x.price].join('|');
function lastActivity(o){return [...(o.events||[]),...(o.revisions||[])].map(x=>timeKey(x.time)).sort().pop()||''}
function unionBy(first,second,key){const m=new Map();for(const x of [...(first||[]),...(second||[])]){const k=key(x);if(!m.has(k))m.set(k,x)}return [...m.values()]}
function mergeOrder(local,inc){
 const incNewer=lastActivity(inc)>lastActivity(local),newer=incNewer?inc:local,older=incNewer?local:inc;
 const out={...older,...newer};
 out.costs=(local.costs&&local.costs.length)?local.costs:(inc.costs||[]); // внутренние расходы — только с этого устройства
 out.events=unionBy(newer.events,older.events,evKey).sort((a,b)=>timeKey(a.time).localeCompare(timeKey(b.time)));
 out.revisions=unionBy(newer.revisions,older.revisions,revKey).sort((a,b)=>timeKey(a.time).localeCompare(timeKey(b.time)));
 out.payments=unionBy(newer.payments,older.payments,p=>p.id);
 out.steps=unionBy(newer.steps,older.steps,stepKey);
 out.workItems=newer.workItems||[];
 out.unread=[...new Set([...(local.unread||[]),...(inc.unread||[])])];
 return out;
}

async function importBackupFile(file){
 let data;
 try{data=JSON.parse(await file.text())}catch(e){alert('Файл не читается как JSON.');return}
 const isFull=data&&data.format===BACKUP_FORMAT;
 const incoming=isFull?data.db:data;
 if(!incoming||!Array.isArray(incoming.orders)){alert('В файле нет нарядов ToothTech.');return}
 const files=isFull&&Array.isArray(data.attachments)?data.attachments:[];
 const fromDoctor=!!data.doctor||!!incoming.testDoctor;
 const who=fromDoctor?'Файл врача ('+(doctors.find(d=>d.id===(data.doctor||incoming.testDoctor))?.name||'врач')+')':isFull?'Полная копия от '+showTime(data.exportedAt):'Файл данных';
 let mode='merge';
 if(isFull&&!fromDoctor){

  if(replace)mode='replace';
  else if(!confirm('Объединить с текущей базой?\nНовые наряды добавятся, у совпадающих — сохранится более свежая версия; ваши расходы и прайсы не изменятся.'))return;

 alert('Перед изменениями будет скачана страховочная копия текущих данных.');
 if(!await exportBackup('ToothTech_before_import'))return;

 let added=0,updated=0,same=0;
 if(mode==='replace'){
  db=JSON.parse(JSON.stringify(incoming));db.orders.forEach(migrateOrder);added=db.orders.length;initWorkspace.migrated=false;
 }else{
  const byId=new Map(db.orders.map(o=>[o.id,o]));
  for(const raw of incoming.orders){const inc=JSON.parse(JSON.stringify(raw));migrateOrder(inc);const local=byId.get(inc.id);
   if(!local){db.orders.unshift(inc);byId.set(inc.id,inc);added++;continue}

 if(save()===false)return;
 selected=null;render();

}

function workDay(o){if(o.delivered)return o.deliveredAt?dayOf(new Date(o.deliveredAt)):(o.due||o.received||'');return ''}
const monthOf=d=>(d||'').slice(0,7);

function monthlyRows(){
 const m=new Map(),get=k=>{if(!m.has(k))m.set(k,{month:k,charged:0,orders:0,costs:0,received:0,paidOut:0,clinics:new Map()});return m.get(k)};
 for(const o of db.orders){
  const day=workDay(o);if(day){const r=get(monthOf(day)),t=total(o),c=costSummary(o).cost;r.charged+=t;r.orders++;r.costs+=c;const cl=r.clinics.get(payerOf(o))||{charged:0,orders:0,costs:0};cl.charged+=t;cl.orders++;cl.costs+=c;r.clinics.set(payerOf(o),cl)}
  for(const p of o.payments.filter(p=>!p.voided))get(monthOf(p.date)).received+=p.amount;
  for(const c of o.costs||[])for(const p of (c.payments||[]).filter(p=>!p.voided))get(monthOf(p.date)).paidOut+=p.amount;
 }
 return [...m.values()].filter(r=>r.month).sort((a,b)=>b.month.localeCompare(a.month));
}

// ---------- акт сверки ----------
function reconciliation(payer,month,includeOpen){
 const os=db.orders.filter(o=>payerOf(o)===payer),start=month+'-01',days=[];
 let openingCharged=0,openingPaid=0;
 for(const o of os){const d=workDay(o);if(d&&d<start)openingCharged+=total(o);if(d&&monthOf(d)===month)days.push({o,d});if(!d&&includeOpen)days.push({o,d:'',open:true});
  for(const p of o.payments.filter(p=>!p.voided)){if(p.date<start)openingPaid+=p.amount}}
 const pays=os.flatMap(o=>o.payments.filter(p=>!p.voided&&monthOf(p.date)===month).map(p=>({o,p}))).sort((a,b)=>a.p.date.localeCompare(b.p.date));
 const charged=days.filter(x=>!x.open).reduce((s,x)=>s+total(x.o),0),paid=pays.reduce((s,x)=>s+x.p.amount,0),opening=openingCharged-openingPaid;
 return {os,days:days.sort((a,b)=>(a.d||'9').localeCompare(b.d||'9')),pays,charged,paid,opening,closing:opening+charged-paid};
}

 const html=`<!doctype html><html lang="ru"><meta charset="utf-8"><title>Акт сверки ${esc(payer)} ${month}</title><style>body{font:12px Arial;color:#222;margin:28px}h1{font-size:18px;margin:0 0 4px}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid #ccc;padding:6px;text-align:left;vertical-align:top}th{background:#f3eef0}td.n{text-align:right;white-space:nowrap}.sum{font-size:13px;margin:4px 0}.sign{display:flex;justify-content:space-between;margin-top:40px}@page{size:A4;margin:14mm}</style>
<h1>Акт сверки взаиморасчётов</h1><div>${esc(payer)} · ${monthName(month)}</div><p class="sum">Сальдо на начало месяца: <b>${sign(r.opening)}</b></p>
<h3>Выполненные работы</h3><table><tr><th>Дата сдачи</th><th>Пациент</th><th>Работы</th><th>Сумма</th></tr>${r.days.map(x=>`<tr><td>${x.open?'в работе':fmtDay(x.d)}</td><td>${esc(x.o.patient)}<br><small>${esc(doc(x.o).name)}</small></td><td>${works(x.o)}</td><td class="n">${x.open?'('+fmt(total(x.o))+')':fmt(total(x.o))}</td></tr>`).join('')||'<tr><td colspan="4">Сданных работ нет</td></tr>'}<tr><th colspan="3">Итого начислено</th><th class="n">${fmt(r.charged)}</th></tr></table>
<h3>Поступившие оплаты</h3><table><tr><th>Дата</th><th>Пациент</th><th>Комментарий</th><th>Сумма</th></tr>${r.pays.map(x=>`<tr><td>${fmtDay(x.p.date)}</td><td>${esc(x.o.patient)}</td><td>${esc(x.p.note||'')}</td><td class="n">${fmt(x.p.amount)}</td></tr>`).join('')||'<tr><td colspan="4">Оплат нет</td></tr>'}<tr><th colspan="3">Итого оплачено</th><th class="n">${fmt(r.paid)}</th></tr></table>
<p class="sum">Сальдо на конец месяца: <b>${sign(r.closing)}</b></p>${r.days.some(x=>x.o.workItems.some(w=>w.pending))?'<p><small>Часть работ без окончательной цены — указаны известные суммы.</small></p>':''}${includeOpen?'<p><small>Суммы в скобках — работы в процессе, в итог не входят.</small></p>':''}
<div class="sign"><div>Зубной техник ____________</div><div>${esc(payer)} ____________</div></div></html>`;

function migrateV14(){
 let changed=false;
 for(const o of db.orders){if(o.payer==='Олексюк Виталий'){o.payer='Виталий';changed=true}}
 const bai=db.prices&&db.prices['Bai-Stom'];

  db.priceBackups??=[];db.priceBackups.push({source:'До цен Bai-Stom V14',at:new Date().toISOString(),prices:JSON.parse(JSON.stringify(db.prices))});
  if(db.priceBackups.length>3)db.priceBackups=db.priceBackups.slice(-3);

// V14.1: надёжное прикрепление фото/видео на Android (Poco/Xiaomi и др.)
async function prepareAttachment(f){
 if(!f||!f.size)throw new Error('файл пустой. Выберите его ещё раз через «Галерею» или «Файлы»');
 if(/^image\//.test(f.type)&&!/gif|svg/.test(f.type)){
  try{const img=await createImageBitmap(f);const k=Math.min(1,2000/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));if(b&&b.size&&b.size<f.size)return new File([b],(f.name||'Фото').replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'})}catch(e){}
 }
 if(/^video\//.test(f.type)&&f.size>60*1024*1024)throw new Error('видео больше 60 МБ. Обрежьте его или прикрепите короче');
 const buf=await f.arrayBuffer();
 return new File([buf],f.name||('Файл '+Date.now()),{type:f.type||'application/octet-stream'});
}

async function cloudClient(){

window.__ttAfterSave=()=>{if(window.__ttSuppress)return;setSyncMeta({dirty:true});if(!sbUser)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>cloudPush(),2500);setSyncStatus('есть изменения…','pending')};
function applyRemote(data){
 window.__ttSuppress=true;
 try{db=JSON.parse(JSON.stringify(data));if(!Array.isArray(db.orders))db.orders=[];db.orders.forEach(migrateOrder);initWorkspace.migrated=false;save()}

// ===== V16: синхронизация по нарядам (каждый наряд — отдельная строка в облаке) =====
const PRIVATE_KEYS=['costs','abutments','formulaBatchDraft','workEntryDraft'];
const LIFESTOM_PRIVATE=['workItems','payments','steps'];
const SETTINGS_SKIP=['orders','deleted'];
function hashStr(s){let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return x}
const orderHash=o=>hashStr(JSON.stringify(o));
function splitOrder(o){
 const priv=o.clinic==='Life-Stom'?[...PRIVATE_KEYS,...LIFESTOM_PRIVATE]:PRIVATE_KEYS,sh={},pr={};
 for(const [k,v] of Object.entries(o)){if(k==='events')continue;(priv.includes(k)?pr:sh)[k]=v}
 sh.events=(o.events||[]).filter(e=>!e.private);pr.events=(o.events||[]).filter(e=>e.private);
 return {sh,pr};
}
function joinOrder(sh,pr){
 const o={...(sh||{}),...(pr||{})};
 o.events=[...((sh&&sh.events)||[]),...((pr&&pr.events)||[])].sort((a,b)=>timeKey(a.time).localeCompare(timeKey(b.time)));
 return o;
}
function settingsPart(){const s={};for(const [k,v] of Object.entries(db))if(!SETTINGS_SKIP.includes(k))s[k]=v;return s}
function publicPart(){return {prices:{'Bai-Stom':(db.prices||{})['Bai-Stom']||[],'Тулеш':(db.prices||{})['Тулеш']||[]}}}
const chunks=(a,n)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r};
let pullTimer=null;

async function ensureV16(c){
 const m=syncMeta();if(m.v16User===sbUser.id)return true;
 const {error:pe}=await c.from('profiles').upsert({user_id:sbUser.id,role:'tech',tech_id:sbUser.id,name:'Техник'},{onConflict:'user_id',ignoreDuplicates:true});
 if(pe&&!/duplicate|conflict/i.test(pe.message||''))throw pe;
 const {count,error}=await c.from('orders').select('id',{count:'exact',head:true}).eq('tech_id',sbUser.id);
 if(error)throw error;
 if(!count){
  if(!db.orders.length){const {data:old}=await c.from('toothtech_state').select('data').eq('user_id',sbUser.id).maybeSingle();if(old&&old.data&&Array.isArray(old.data.orders))applyRemote(old.data)}
  setSyncMeta({hashes:{},setHash:null,since:null,sentDeleted:{}});
 }else setSyncMeta({hashes:{},since:null});
 setSyncMeta({v16User:sbUser.id});return true;
}

async function cloudPull(){
 const c=await cloudClient().catch(e=>{setSyncStatus('ошибка: '+e.message,'error');return null});if(!c||!sbUser)return;
 if(syncBusy){clearTimeout(pullTimer);pullTimer=setTimeout(cloudPull,1500);return}
 syncBusy=true;
 try{
  await ensureV16(c);
  const m=syncMeta(),since=m.since,hashes={...(m.hashes||{})};
  let q1=c.from('orders').select('id,data,updated_at,deleted,device').eq('tech_id',sbUser.id).order('updated_at',{ascending:true}).limit(2000);
  let q2=c.from('order_private').select('order_id,data,updated_at').eq('tech_id',sbUser.id).order('updated_at',{ascending:true}).limit(2000);
  let q3=c.from('tech_settings').select('data,updated_at').eq('tech_id',sbUser.id);
  if(since){q1=q1.gt('updated_at',since);q2=q2.gt('updated_at',since);q3=q3.gt('updated_at',since)}
  const [r1,r2,r3]=await Promise.all([q1,q2,q3]);
  for(const r of [r1,r2,r3])if(r.error)throw r.error;
  const rows=r1.data||[],privs=new Map((r2.data||[]).map(p=>[p.order_id,p])),st=(r3.data||[])[0];
  let maxAt=since||'',changed=false,needPush=false;const bump=t=>{if(t&&t>maxAt)maxAt=t};
  db.deleted??={};
  for(const r of rows){bump(r.updated_at);
   const i=db.orders.findIndex(o=>o.id===r.id);
   if(r.deleted){if(i>=0){db.orders.splice(i,1);changed=true}db.deleted[r.id]=db.deleted[r.id]||r.updated_at;delete hashes[r.id];continue}
   if(db.deleted[r.id])continue;
   const local=i>=0?db.orders[i]:null,p=privs.get(r.id);if(p)bump(p.updated_at);
   const remote=joinOrder(r.data,p?p.data:(local?splitOrder(local).pr:{}));migrateOrder(remote);
   if(!local){db.orders.unshift(remote);hashes[r.id]=orderHash(remote);changed=true;continue}
   if(hashes[r.id]===orderHash(local)){db.orders[i]=remote;hashes[r.id]=orderHash(remote);changed=true}
   else{db.orders[i]=mergeOrder(local,remote);changed=true;needPush=true}
  }
  for(const [id,p] of privs){bump(p.updated_at);if(rows.some(r=>r.id===id))continue;const i=db.orders.findIndex(o=>o.id===id);if(i<0)continue;const local=db.orders[i];
   if(hashes[id]===orderHash(local)){const merged=joinOrder(splitOrder(local).sh,p.data);migrateOrder(merged);db.orders[i]=merged;hashes[id]=orderHash(merged);changed=true}else needPush=true}
  let setHash=m.setHash;
  if(st){bump(st.updated_at);if(!m.setHash||m.setHash===hashStr(JSON.stringify(settingsPart()))){for(const [k,v] of Object.entries(st.data||{}))if(!SETTINGS_SKIP.includes(k))db[k]=v;setHash=hashStr(JSON.stringify(settingsPart()));changed=true}else needPush=true}
  if(changed){window.__ttSuppress=true;try{db.orders.forEach(migrateOrder);save()}finally{window.__ttSuppress=false}}
  setSyncMeta({hashes,setHash,since:maxAt||null});
  if(changed){const sc=$('detail')?.scrollTop;render();if($('detail')&&sc)$('detail').scrollTop=sc}
  syncBusy=false;
  await cloudPush(true);
  if(!needPush)setSyncStatus('синхронизировано · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),'ok');
  return;
 }catch(e){setSyncStatus(/relation|does not exist|schema cache/i.test(e.message||'')?'нужно запустить SQL V16 в Supabase':'ошибка загрузки: '+(e.message||e),'error')}
 syncBusy=false;
}

async function cloudPush(){
 const c=await cloudClient().catch(()=>null);if(!c||!sbUser)return;
 if(syncBusy){clearTimeout(syncTimer);syncTimer=setTimeout(()=>cloudPush(),2000);return}
 syncBusy=true;
 try{
  await ensureV16(c);
  const m=syncMeta(),hashes={...(m.hashes||{})},sentDeleted={...(m.sentDeleted||{})},dev=deviceName();
  const rows=[],privs=[],newH={};
  for(const o of db.orders){const h=orderHash(o);if(hashes[o.id]===h)continue;const {sh,pr}=splitOrder(o);
   rows.push({id:o.id,tech_id:sbUser.id,doctor_key:o.doctor||null,data:sh,deleted:false,device:dev});privs.push({order_id:o.id,tech_id:sbUser.id,data:pr});newH[o.id]=h}
  for(const id of Object.keys(db.deleted||{}))if(!sentDeleted[id]){rows.push({id,tech_id:sbUser.id,doctor_key:null,data:{},deleted:true,device:dev});sentDeleted[id]=true}
  const setH=hashStr(JSON.stringify(settingsPart()));
  if(!rows.length&&setH===m.setHash){syncBusy=false;setSyncStatus('синхронизировано · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),'ok');return}
  setSyncStatus('отправляю…','pending');
  for(const part of chunks(rows,50)){const {error}=await c.from('orders').upsert(part,{onConflict:'id'});if(error)throw error}
  for(const part of chunks(privs,50)){const {error}=await c.from('order_private').upsert(part,{onConflict:'order_id'});if(error)throw error}
  if(setH!==m.setHash){const {error:e1}=await c.from('tech_settings').upsert({tech_id:sbUser.id,data:settingsPart()},{onConflict:'tech_id'});if(e1)throw e1;await c.from('tech_public').upsert({tech_id:sbUser.id,data:publicPart()},{onConflict:'tech_id'})}
  const today=localDay();
  if(m.backupDay!==today){const {error:e2}=await c.from('toothtech_backups').insert({user_id:sbUser.id,data:db,device:dev});if(!e2)setSyncMeta({backupDay:today})}
  setSyncMeta({hashes:{...hashes,...newH},sentDeleted,setHash:setH,dirty:false,lastRemoteDevice:dev,lastRemoteAt:new Date().toISOString()});
  setSyncStatus('синхронизировано · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),'ok');
 }catch(e){setSyncStatus(/relation|does not exist|schema cache/i.test(e.message||'')?'нужно запустить SQL V16 в Supabase':'не отправлено: '+(e.message||e),'error')}
 syncBusy=false;
}
setInterval(()=>{if(sbUser&&document.visibilityState==='visible')cloudPull()},60000);

function cloudPanel(){
 const m=syncMeta(),box=document.createElement('div');box.id='cloudPanel';box.className='cloud-panel';

  });
  const debtOf = os => os.reduce((s, o) => s + Math.max(balance(o), 0), 0);
  const month = localDay().slice(0, 7);
  const payments = db.orders.flatMap(o => (o.payments || []).filter(p => !p.voided).map(p => ({ o, date: String(p.date || ''), amount: Number(p.amount) || 0 })));
  const gotMonth = payments.filter(p => p.date.slice(0, 7) === month).reduce((s, p) => s + p.amount, 0);
  const inWork = db.orders.filter(o => !o.delivered).reduce((s, o) => s + total(o), 0);

    (vend ? '<details class="tt-sec"><summary>Я должен подрядчикам</summary><div class="tt-rows">' + vend + '</div></details>' : '') +
    (last ? '<details class="tt-sec"><summary>Последние поступления</summary><div class="tt-rows">' + last + '</div></details>' : '');

const TT_SITE = 'https://a1extoothtech-maker.github.io/toothtech/';
const MONEY_KEYS = ['payments', 'paid', 'receivedPayment', 'legacyPaymentMarked', 'paymentNoticeAcknowledged', 'doctorSent', 'base', 'steps', 'payer'];
const MONEY_EVENTS = ['Стоимость', 'Оплата', 'Внутренние расходы', 'Этап изготовления', 'Расходы', 'Тариф'];
const isMoneyEvent = e => !!e && (e.private || MONEY_EVENTS.includes(e.type) || /₸/.test(String(e.text || '')));
const isMoneyRev = r => !!r && (/цен|стоим|оплат|ставк|тариф|base|price|payer|плательщ/i.test(String(r.field || '')) || /₸/.test(String(r.old || '') + String(r.value || '')));

splitOrder = function (o) {
  const priv = new Set([...PRIVATE_KEYS, ...MONEY_KEYS]), sh = {}, pr = {};
  for (const [k, v] of Object.entries(o)) {
    if (k === 'events' || k === 'revisions' || k === 'workItems') continue;
    (priv.has(k) ? pr : sh)[k] = v;
  }
  sh.workItems = (o.workItems || []).map(w => ({ id: w.id, name: w.name, teeth: w.teeth || [], kind: w.kind, qty: w.qty, unit: w.unit, supports: w.supports || [] }));
  pr.workItems = o.workItems || [];
  sh.events = (o.events || []).filter(e => !isMoneyEvent(e)); pr.events = (o.events || []).filter(isMoneyEvent);
  sh.revisions = (o.revisions || []).filter(r => !isMoneyRev(r)); pr.revisions = (o.revisions || []).filter(isMoneyRev);
  return { sh, pr };
};
function ttArrays(o) { for (const k of ['steps', 'payments', 'costs', 'events', 'revisions', 'unread', 'teeth', 'bridges', 'workItems', 'abutments']) if (!Array.isArray(o[k])) o[k] = []; return o; }
joinOrder = function (sh, pr) {
  sh = sh || {}; pr = pr || {};
  const o = { ...sh, ...pr };
  o.workItems = Array.isArray(pr.workItems) ? pr.workItems : (sh.workItems || []);
  o.events = unionBy(sh.events, pr.events, evKey).sort((a, b) => timeKey(a.time).localeCompare(timeKey(b.time)));
  o.revisions = unionBy(sh.revisions, pr.revisions, revKey).sort((a, b) => timeKey(a.time).localeCompare(timeKey(b.time)));
  return ttArrays(o);
};

// ---------- следующий шаг ----------
function ttSnapshot(o) { const s = JSON.stringify(o); return () => { const at = ttFind(o.id); if (!at) return; const back = JSON.parse(s); ttPlace(back, at); save(); render(); if (selected === back.id) renderDetail(); }; }
function ttNext(o) {
  if (role() !== 'tech' || !o || o.archived) return null;
  if (o.paused) return { label: '▶ Вернуть в работу', hint: 'Наряд на паузе', run: () => toggleProduction(o) };
  if (!o.delivered) {
    const plan = stagePlan(o), idx = stageIdx(o);
    if (idx < 0) return { label: '▶ Начать: ' + plan[0], hint: 'Первый этап', run: () => setStage(o, 0) };
    if (idx < plan.length) return { label: '✓ ' + plan[idx] + ' — готово', hint: 'Дальше: ' + (plan[idx + 1] || 'готова к сдаче'), run: () => setStage(o, idx + 1) };
    return { cls: 'ready', label: '✓ Сдать работу', hint: 'Работа готова — отметить сдачу врачу', run: () => { o.delivered = true; o.deliveredAt = new Date().toISOString(); o.paid = false; log(o, 'Сдача', 'Работа сдана'); save(); render(); } };
  }
  const left = balance(o);
  if (left > 0) return { cls: 'pay', label: '₸ Оплата получена · ' + fmt(left), hint: 'Внесёт платёж на весь остаток. Частичная оплата — во вкладке «Деньги»', run: () => { o.payments.push({ id: uid(), amount: left, date: localDay(), note: 'Полная оплата', createdAt: new Date().toISOString(), by: actor() }); o.legacyPaymentMarked = false; o.paymentNoticeAcknowledged = true; log(o, 'Оплата', 'Получено ' + fmt(left) + ' · ' + localDay()); save(); render(); } };
  return null;
}

  const n = ttNext(o); if (!n) return;
  const undo = ttSnapshot(o); n.run();
  if (selected === o.id) renderDetail();
  ttToast((quiet ? o.patient + ': ' : '') + n.label.replace(/^[✓▶₸]\s*/, ''), 'Отменить', undo);
}

function ttParse(text) {
